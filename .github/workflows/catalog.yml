name: Türkiye ürün kataloğu

# Open Food Facts'ten (ODbL) Türkiye ürün barkodlarını indirir ve depoya kaydeder: server/data/tr-*.json
on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Sayfa sayısı (sayfa başına 100 ürün)'
        default: '40'
  schedule:
    - cron: '17 3 1 * *'   # her ayın 1'i

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-off.mjs ${{ github.event.inputs.pages || '40' }}
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "Velaris Dijital"
          git config user.email "velarisdijital@gmail.com"
          git add server/data/tr-barcodes.json server/data/tr-products.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Türkiye ürün kataloğu güncellendi (Open Food Facts, ODbL)"
          git push
