name: Türkiye ürün kataloğu

# Open Food Facts'ten (ODbL) Türkiye ürün barkodlarını indirir ve depoya kaydeder: server/data/tr-*.json
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dump (toplu veri dosyası, önerilen) ya da sayfa sayısı (arama servisi)'
        default: 'dump'
  schedule:
    - cron: '17 3 1 * *'   # her ayın 1'i

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Kodu güncelle (temizlik kuralları değişmiş olabilir)
        run: git pull --ff-only origin main || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open Food Facts'ten indir
        run: |
          MODE="${{ github.event.inputs.mode || 'dump' }}"
          if [ "$MODE" = "dump" ]; then node scripts/import-off.mjs --dump; else node scripts/import-off.mjs "$MODE"; fi
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "Velaris Dijital"
          git config user.email "velarisdijital@gmail.com"
          git add server/data/off-raw.json server/data/tr-barcodes.json server/data/tr-products.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Türkiye ürün kataloğu güncellendi (Open Food Facts, ODbL)"
          git push
