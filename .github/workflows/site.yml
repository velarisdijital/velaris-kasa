name: Site

# Tanıtım sayfası (/) ve tarayıcıda çalışan uygulama (/uygulama/) GitHub Pages'e yayınlanır.
# Özel alan adı (velariskasa.com) depo ayarlarından (Settings → Pages) bağlanır.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run demo:build
      - run: node landing/build.mjs
      - name: Siteyi birleştir
        run: |
          mkdir -p site/uygulama
          cp -r landing/public/. site/
          cp brand/logo/velariskasa-light.png site/og-image.png
          cp dist-demo/velaris-kasa-demo.html site/uygulama/index.html
          touch site/.nojekyll
      - name: Pages'i aç (kapalıysa)
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
