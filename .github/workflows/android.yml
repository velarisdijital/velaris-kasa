name: Android APK

# Tablet / telefon uygulaması: web arayüzü + cihazda çalışan sunucu (sql.js), internetsiz.
# Çıktı: GitHub Releases → "android-latest" → VelarisKasa.apk  (ve iş eki olarak)
on:
  push:
    branches: [main]
    paths: ['web/**', 'server/**', 'android/**', 'capacitor.config.json', 'vite.*.js', 'scripts/build-app.mjs', 'scripts/e2e/**', 'package*.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Derleme numarası: APK sürümü ve uygulama içi güncellemenin (OTA) web paketi sürümü
      VK_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Web arayüzünü derle ve Android projesine kopyala
        run: |
          node scripts/build-app.mjs
          npx cap sync android
      - name: Bluetooth yazıcı akışı uçtan uca testi (sahte Android köprüsüyle)
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/e2e/android-printer.e2e.cjs
      - name: Birden çok cihaz ve mutfak ekranı uçtan uca testi (gerçek sunucu + iki tablet)
        run: node scripts/e2e/multi-device.e2e.cjs
      - name: İmza anahtarı (GitHub sırlarında varsa üretim anahtarı, yoksa test anahtarı)
        env:
          KS_B64: ${{ secrets.VK_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.VK_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "VK_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "VK_KEY_ALIAS=velariskasa" >> "$GITHUB_ENV"
            echo "Üretim imza anahtarı kullanılıyor"
          else
            echo "::warning::Üretim imza anahtarı yok (VK_KEYSTORE_BASE64 / VK_KEYSTORE_PASSWORD); test anahtarıyla imzalanıyor"
          fi
      - name: APK derle (imzalı)
        working-directory: android
        env:
          VK_BUILD_NUMBER: ${{ github.run_number }}
          VK_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../VelarisKasa.apk
          ls -la ../VelarisKasa.apk
          # Uygulama içi güncelleme (OTA) için web paketi: tek dosya
          cp ../dist-app/index.html ../VelarisKasa-web.html
      - uses: actions/upload-artifact@v4
        with:
          name: VelarisKasa-apk
          path: VelarisKasa.apk
      - name: Yayınla (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # native_api: bu web paketinin istediği en düşük Android eklenti sürümü (uygulama içi güncelleme okur)
          NAPI=$(grep -oE 'REQUIRED_NATIVE_API = [0-9]+' web/src/ota.js | grep -oE '[0-9]+$')
          NOTES="VelarisKasa Android 1.0.${{ github.run_number }} — tablet ve telefonda internetsiz çalışır. Kurulum: APK'yı indirip açın; \"bilinmeyen kaynaklardan yüklemeye\" izin verin. Sonraki sürümler uygulama içinden kendiliğinden gelir. native_api=${NAPI}"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest VelarisKasa.apk VelarisKasa-web.html --clobber
            gh release edit android-latest --title "VelarisKasa Android 1.0.${{ github.run_number }}" --notes "$NOTES"
          else
            gh release create android-latest VelarisKasa.apk VelarisKasa-web.html --title "VelarisKasa Android 1.0.${{ github.run_number }}" --notes "$NOTES" --prerelease
          fi
