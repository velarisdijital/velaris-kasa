name: Derle

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  okc-adapter:
    # Yazarkasa ara programı (C#): derle, simülatörle doğrudan ve köprü üzerinden dene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet build bridge/adapter-dotnet -c Release -o okc
      - name: Simülatörle doğrudan
        run: |
          set -e
          OUT=$(echo '{"action":"status"}' | dotnet okc/VelarisOkc.dll); echo "$OUT"; echo "$OUT" | grep -q '"ok":true'
          R='{"action":"receipt","data":{"sale_id":1,"receipt_no":"T-1","items":[{"name":"Peynir","qty":1.25,"unit":"kg","unit_price":32000,"discount":0,"vat_rate":1,"line_total":40000},{"name":"Kola","qty":2,"unit_price":4000,"discount":0,"vat_rate":20,"line_total":8000}],"subtotal":48000,"discount":1000,"total":47000,"payments":[{"method":"cash","amount":20000},{"method":"card","amount":27000}]}}'
          OUT=$(echo "$R" | dotnet okc/VelarisOkc.dll); echo "$OUT"; echo "$OUT" | grep -q '"fiscal_no":"0001"'
          OUT=$(echo "$R" | OKC_SIM_DECLINE=1 dotnet okc/VelarisOkc.dll); echo "$OUT"; echo "$OUT" | grep -q 'reddedildi'
          OUT=$(echo '{"action":"receipt","data":{"items":[{"name":"X","qty":1,"unit_price":100,"vat_rate":18,"line_total":100}],"total":100,"payments":[{"method":"cash","amount":100}]}}' | dotnet okc/VelarisOkc.dll); echo "$OUT"; echo "$OUT" | grep -q 'KDV için cihazda grup'
          OUT=$(echo '{"action":"status"}' | OKC_BRAND=hugin dotnet okc/VelarisOkc.dll); echo "$OUT"; echo "$OUT" | grep -q 'SDK'
          OUT=$(echo '{"action":"z-report"}' | dotnet okc/VelarisOkc.dll); echo "$OUT"; echo "$OUT" | grep -q '"z_no":"0001"'
      - name: Köprü üzerinden
        run: |
          set -e
          OKC_ADAPTER=command OKC_COMMAND="dotnet $PWD/okc/VelarisOkc.dll" OKC_BRIDGE_PORT=4850 node bridge/okc-bridge.js &
          sleep 2
          curl -fsS http://127.0.0.1:4850/status
          curl -fsS -X POST http://127.0.0.1:4850/receipt -H 'Content-Type: application/json' -d '{"sale_id":2,"receipt_no":"T-2","items":[{"name":"Ekmek","qty":1,"unit_price":1000,"discount":0,"vat_rate":1,"line_total":1000}],"subtotal":1000,"discount":0,"total":1000,"payments":[{"method":"cash","amount":1000}]}' | grep -q fiscal_no

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t velaris-kasa .
      - name: Konteyneri başlat ve sağlık kontrolü
        run: |
          docker run -d --name kasa -p 4848:4848 velaris-kasa
          for i in $(seq 1 30); do curl -fsS http://localhost:4848/api/health && break; sleep 1; done
          trap 'docker ps -a; docker logs kasa' EXIT
          curl -fsS http://localhost:4848/api/setup/status
          curl -fsS http://localhost:4848/ | grep -q 'VelarisKasa'
          test "$(docker exec kasa date +%z)" = "+0300"

  windows:
    # Windows kurulum dosyası (.exe) — etiket (v1.0.0 gibi) atıldığında ya da elle tetiklendiğinde
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: velaris-kasa-windows
          path: release/*.exe
